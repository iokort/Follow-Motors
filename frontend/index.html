<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Follow Motors: catálogo de motocicletas y seguimiento de servicios.">

    <title>Follow Motors | Inicio</title>

    <link rel="icon"
          href="./assets/images/branding/favicon.png">

    <!-- Estilos generales -->
    <link rel="stylesheet" href="./css/styles.css">

    <!-- Estilos de componentes -->
    <link rel="stylesheet" href="./css/components/navbar.css">
    <link rel="stylesheet" href="./css/components/home.css">
    <link rel="stylesheet" href="./css/components/catalogo.css">
    <link rel="stylesheet" href="./css/components/servicios.css">
    <link rel="stylesheet" href="./css/components/auth.css">
    <link rel="stylesheet" href="./css/components/dashboard.css">
    <link rel="stylesheet" href="./css/components/citas.css">

    <!-- Aplicación -->
    <script type="module" src="./js/app.js"></script>
</head>

<body>
    <!-- Menú de navegación -->
    <div id="navbar"></div>

    <!-- Contenido de las vistas -->
    <div id="app"></div>

    <!-- Estado de conexión -->
    <section class="api-section"
             aria-labelledby="api-title">

        <div class="api-content">
            <h2 id="api-title">Estado del sistema</h2>

            <p id="api-status"
               role="status"
               aria-live="polite">
                Comprobando conexión…
            </p>

            <button id="retry-api" type="button">
                Reintentar conexión
            </button>
        </div>

    </section>

    <!-- Pie de página -->
    <div id="footer"></div>
</body>
</html>
