name: follow-motors
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-follow_motors}
      MYSQL_USER: ${MYSQL_USER:-follow_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: backend/FollowMotors.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: "Server=mysql;Port=3306;Database=${MYSQL_DATABASE:-follow_motors};User ID=${MYSQL_USER:-follow_app};Password=${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env};"
      Cors__AllowedOrigins__0: http://localhost:5500
      Cors__AllowedOrigins__1: http://127.0.0.1:5500
    ports:
      - "127.0.0.1:5099:8080"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
