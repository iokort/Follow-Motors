name: Publicar API en GHCR

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  package:
    if: github.event_name == 'release' || github.ref == 'refs/heads/main'
    name: Contenedor ASP.NET Core
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Preparar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Verificar compilación
        run: dotnet build backend/FollowMotors.Api/FollowMotors.Api.csproj -c Release
      - name: Iniciar sesión en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Metadatos de imagen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/iokort/follow-motors-api
          tags: |
            type=ref,event=tag
            type=sha,prefix=sha-
      - name: Compilar y publicar contenedor
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/FollowMotors.Api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
